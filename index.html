<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wizarding Archive</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>The Wizarding Archive</h1>
        <p>Explorá los personajes del mundo mágico de Harry Potter</p>
    </header>

    <main>
        <section class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Buscar personaje..."
            >
            <select id="houseFilter">
                <option value="">Todas las casas</option>
                <option value="Gryffindor">Gryffindor</option>
                <option value="Hufflepuff">Hufflepuff</option>
                <option value="Ravenclaw">Ravenclaw</option>
                <option value="Slytherin">Slytherin</option>
            </select>
        </section>

        <section id="charactersContainer"></section>
    </main>

    <footer>
        <p>2026 Proyecto académico - Ingeniería de Software</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
